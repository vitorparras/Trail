services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TRAIL_DOMAIN: ${TRAIL_DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ghcr.io/vitorparras/trail:latest
    build:
      context: ..
    expose:
      - "8080"
    environment:
      Database__Provider: PostgreSql
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-trail};Username=${POSTGRES_USER:-trail};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - trail-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trail}
      POSTGRES_USER: ${POSTGRES_USER:-trail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - trail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trail} -d ${POSTGRES_DB:-trail}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  trail-data:
  trail-postgres:
  caddy-data:
  caddy-config:
