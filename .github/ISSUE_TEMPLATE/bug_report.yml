name: Relatar bug
description: Algo não funciona como esperado.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo relato. **Não relate problemas de segurança aqui**; use o canal privado descrito em [SECURITY.md](https://github.com/vitorparras/Trail/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o bug e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      placeholder: "main @ abc1234"
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operacional, navegador, versão do runtime, Docker, o que for relevante.
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas de tela
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: Procurei nas issues existentes e este problema ainda não foi relatado.
          required: true
        - label: Concordo em seguir o Código de Conduta deste projeto.
          required: true
