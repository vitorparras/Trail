services:
  app:
    image: ghcr.io/vitorparras/trail:latest
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      Database__Provider: Sqlite
      ConnectionStrings__Default: Data Source=/data/trail.db
    volumes:
      - trail-data:/data
    restart: unless-stopped

volumes:
  trail-data:
